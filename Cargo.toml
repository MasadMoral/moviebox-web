[package]
name = "moviebox-web"
version = "1.0.8"
edition = "2024"

[lib]
name = "moviebox_web"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "moviebox-web"
path = "src/main.rs"

[dependencies]
moviebox-tui = { git = "https://github.com/skumarbsft/MovieBox-Tui", branch = "fix/moviebox-stream-recovery-205" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream"] }
futures = "0.3"
percent-encoding = "2"
base64 = "0.23"

[profile.release]
lto = true
codegen-units = 1
strip = true
