name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    uses: ./.github/workflows/android.yml

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-musl
            targets: x86_64-unknown-linux-musl
            archive: moviebox-web-linux-x86_64.tar.gz
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            targets: x86_64-pc-windows-msvc
            archive: moviebox-web-windows-x86_64.zip
          - os: macos-latest
            platform: macos-universal
            target: universal
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            archive: moviebox-web-macos-universal.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (Linux)
        if: runner.os == 'Linux'
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="moviebox-web-${{ matrix.platform }}"
          mkdir -p "dist/$name/static"
          if [ "${{ matrix.platform }}" = "macos-universal" ]; then
            lipo -create \
              target/aarch64-apple-darwin/release/moviebox-web \
              target/x86_64-apple-darwin/release/moviebox-web \
              -output "dist/$name/moviebox-web"
            codesign --force --sign - "dist/$name/moviebox-web"
          else
            cp "target/${{ matrix.target }}/release/moviebox-web" "dist/$name/moviebox-web"
          fi
          chmod +x "dist/$name/moviebox-web"
          cp static/index.html "dist/$name/static/index.html"
          cp README.md "dist/$name/README.md"
          tar -czf "dist/${{ matrix.archive }}" -C dist "$name"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "moviebox-web-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path "dist/$name/static" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/moviebox-web.exe" "dist/$name/moviebox-web.exe"
          Copy-Item "static/index.html" "dist/$name/static/index.html"
          Copy-Item "README.md" "dist/$name/README.md"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/${{ matrix.archive }}" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: moviebox-web-${{ matrix.platform }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [android, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | File |
            |---|---|
            | Windows 10/11 (x64) | `moviebox-web-windows-x86_64.zip` |
            | Linux (x64, static musl) | `moviebox-web-linux-x86_64.tar.gz` |
            | macOS (Apple Silicon + Intel) | `moviebox-web-macos-universal.tar.gz` |
            | Android 7+ (arm64) | `moviebox-web-android-arm64.apk` |

            The desktop builds are the local MovieBox server. Extract the archive, run the binary, then open <http://127.0.0.1:8787>.

            - **Windows:** run `moviebox-web.exe`. SmartScreen may warn because the build is unsigned: choose **More info → Run anyway**.
            - **Linux:** `tar -xzf moviebox-web-linux-x86_64.tar.gz && cd moviebox-web-linux-x86_64 && ./moviebox-web`
            - **macOS:** `tar -xzf moviebox-web-macos-universal.tar.gz && cd moviebox-web-macos-universal && ./moviebox-web`. If Gatekeeper blocks it, run `xattr -d com.apple.quarantine moviebox-web` first.
            - **Android:** allow installs from your browser or file manager. The APK is arm64 and debug-signed, so it is for sideloading (not Play Store). Picture-in-Picture needs Android 8+.
            - **iOS:** there is no standalone iOS build yet because the project has no iOS shell or signing setup. You can still use the web UI from Safari while the server runs on another machine.

            ### Fullscreen fix

            Wide phones now fill the screen in fullscreen by default. Tap the **Fill** pill at the top of the fullscreen player to switch between **Fill**, **Fit**, **Stretch**, **16:9**, **4:3**, and **21:9**.

            Verify the downloads against `SHA256SUMS`.
