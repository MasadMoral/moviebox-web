name: Android APK

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the Rust server library (arm64)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a -o jniLibs build --release --lib

      - name: Create the Flutter project and apply our files
        run: |
          flutter create --platforms=android --org com.masad --project-name moviebox app
          rm -rf app/test
          cp -r android-app/overlay/. app/
          mkdir -p app/android/app/src/main/jniLibs
          cp -r jniLibs/. app/android/app/src/main/jniLibs/
          M=app/android/app/src/main/AndroidManifest.xml
          android-app/patch-manifest.sh "$M"
          cat "$M"

      - name: Fetch Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Patch the WebView plugin for the current Android Gradle Plugin
        run: android-app/patch-deps.sh

      - name: Build the APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename the APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk moviebox-web-android-arm64.apk

      - uses: actions/upload-artifact@v7
        with:
          name: moviebox-web-android-arm64
          path: moviebox-web-android-arm64.apk
          if-no-files-found: error
          retention-days: 7
