<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>MovieBox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1115'/%3E%3Ccircle cx='32' cy='32' r='18' fill='%2319d3a2'/%3E%3Cpath d='M28 23l14 9-14 9z' fill='%2304201a'/%3E%3C/svg%3E">
<style>
:root{--bg:#0f1115;--card:#1a1d24;--card2:#262a33;--fg:#e8eaed;--mut:#8b919c;--acc:#19d3a2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
button,select,.btn{background:var(--card2);color:var(--fg);border:0;border-radius:999px;padding:10px 16px;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.pri,button.on{background:var(--acc);color:#04201a;font-weight:600}
header{position:sticky;top:0;background:var(--bg);padding:10px;z-index:5;display:flex;gap:8px}
header input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:0;background:var(--card);color:var(--fg);font-size:16px}
#sug{position:absolute;left:10px;right:10px;top:56px;background:var(--card);border-radius:12px;z-index:9;display:none;overflow:hidden}
#sug div{padding:12px;border-bottom:1px solid var(--card2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;padding:10px}
.card{background:var(--card);border-radius:10px;overflow:hidden;content-visibility:auto;contain-intrinsic-size:auto 230px}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#222}
.card div{padding:6px;font-size:12px;line-height:1.3}
.card small,.mut{color:var(--mut)}
.bar{height:3px;background:var(--acc);padding:0!important}
h3{margin:14px 12px 0}
#detail{display:none}
#player{position:sticky;top:0;z-index:6;background:#000}
#player video{width:100%;aspect-ratio:16/9;max-height:56vh;background:#000;display:block}
#vmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#fff;pointer-events:none;font-size:14px}
header button{padding:10px 12px}
.ov{background:#000a;padding:8px 12px;transition:opacity .25s}
#back{position:absolute;top:8px;left:8px;z-index:2}
.ovr{position:absolute;top:8px;right:8px;z-index:2;display:flex;gap:6px;transition:opacity .25s}
#player.idle .ov,#player.idle .ovr{opacity:0;pointer-events:none}
body.fsv{overflow:hidden}
#player:fullscreen,#player:-webkit-full-screen{position:fixed;inset:0;width:100%;height:100%;max-height:none;background:#000}
#player.fs{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;max-height:none;z-index:2147483647;background:#000}
#player.fs video{position:absolute;inset:0;width:100%;height:100%;max-height:none;aspect-ratio:auto;object-fit:contain;background:#000}
#player.fs.rfill video{object-fit:cover}
#player.fs.rstretch video{object-fit:fill}
#player.fs.r169 video,#player.fs.r43 video,#player.fs.r219 video{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);height:auto;object-fit:fill}
#player.fs.r169 video{width:min(100vw,calc(100vh * 1.7778));aspect-ratio:16/9}
#player.fs.r43 video{width:min(100vw,calc(100vh * 1.3333));aspect-ratio:4/3}
#player.fs.r219 video{width:min(100vw,calc(100vh * 2.3333));aspect-ratio:21/9}
#player.fs .ovr{top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right))}
#player.fs #back{top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left))}
#player.fs #cc{top:calc(52px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right))}
#player.fs #subs{bottom:calc(14% + env(safe-area-inset-bottom))}
#ratb{display:none;position:absolute;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:3;background:#000a;padding:8px 12px;border-radius:999px;font-size:13px;transition:opacity .25s}
#player.fs #ratb{display:inline-flex}
#player.idle #ratb{opacity:0;pointer-events:none}
#ratmenu{display:none;position:absolute;top:calc(52px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:7;background:#10131af2;border-radius:12px;padding:6px;min-width:190px;box-shadow:0 10px 30px #0008}
#ratmenu button{display:flex;justify-content:space-between;align-items:center;width:100%;background:transparent;border-radius:8px;padding:9px 12px;font-size:13px;text-align:left}
#ratmenu button.on{background:var(--acc);color:#04201a}
#ratmenu small{color:var(--mut);font-size:11px;margin-left:10px}
#ratmenu button.on small{color:#04201a}
.card{position:relative}
.card .x{position:absolute;top:4px;right:4px;padding:2px 8px;background:#000b;border-radius:8px;font-size:12px}
.phead{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--card2)}
.phead select{background:none;border:1px solid var(--mut);padding:10px 14px}
.egrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:14px 12px 40px}
.egrid button{border-radius:8px;height:50px;justify-content:center;padding:0}
#epPanel{display:none}
#detail.allmode .ha{display:none}
#detail.allmode #epPanel{display:block}
.info{padding:12px}
.info h2{margin:0 0 4px;font-size:19px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 12px;scrollbar-width:none}
.chips button{flex:none;min-width:48px;justify-content:center;border-radius:10px}
.acts{display:flex;gap:8px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.acts>*{flex:none}
select{border-radius:10px;max-width:100%}
.desc{padding:8px 12px;color:#c5c9d1;line-height:1.45}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;pointer-events:none}
#player video{touch-action:none;-webkit-touch-callout:none;user-select:none}
#spd{position:absolute;top:56px;left:50%;transform:translateX(-50%);background:#000b;color:#fff;padding:6px 14px;border-radius:999px;font-size:13px;display:none;z-index:3;pointer-events:none}
#ghud{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none;align-items:center;gap:10px;background:#000b;padding:10px 16px;border-radius:14px;z-index:5;pointer-events:none;min-width:190px}
#ghud .ic{width:22px;height:22px}
#ghudtrack{flex:1;height:5px;background:#ffffff33;border-radius:3px;overflow:hidden}
#ghudfill{height:100%;width:50%;background:var(--acc);border-radius:3px}
#ghudnum{font-size:13px;min-width:40px;text-align:right;font-weight:600}
body.pip #player{position:fixed;inset:0;z-index:9999;background:#000}
body.pip #player video{inset:0!important;transform:none!important;width:100%!important;height:100%!important;max-height:none!important;aspect-ratio:auto!important;object-fit:contain!important}
body.pip #player .ovr,body.pip #player #back,body.pip #player #ratb,body.pip #player #ratmenu{display:none!important}
#sug .row{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--card2)}
#sug .row img{width:34px;height:48px;object-fit:cover;border-radius:6px;background:#222;flex:none}
#sug .row b{font-weight:500}
#subs{position:absolute;left:0;right:0;bottom:14%;text-align:center;pointer-events:none;z-index:1;padding:0 5%}
#subs span{display:inline-block;white-space:pre-wrap;line-height:1.35;padding:.08em .45em;border-radius:6px;font-weight:600;max-width:100%}
#cc{position:absolute;right:8px;top:52px;width:min(310px,94%);max-height:calc(100% - 64px);overflow:auto;background:#10131af2;border-radius:14px;padding:12px;z-index:4;display:none;font-size:13px}
#cc.peek{opacity:.3}
#cc h4{margin:10px 0 6px;font-size:12px;color:var(--mut);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
#cc h4:first-child{margin-top:0}
#cc .row2{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#cc button{padding:6px 12px;font-size:13px}
#cc input[type=range]{width:100%;accent-color:var(--acc)}
#cc .sw{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid transparent}
#cc .sw.on{border-color:var(--acc)}
</style></head><body>

</svg>
<header id="hd">
  <input id="q" placeholder="Search movies, shows, anime…" enterkeyhint="search" autocomplete="off">
  <button class="pri" onclick="doSearch()" aria-label="Search"><svg class="ic"><use href="#i-search"/></svg></button>
  <button id="bHome" onclick="goHome()" aria-label="Home"><svg class="ic"><use href="#i-home"/></svg></button>
  <button id="bLib" onclick="openLib()" aria-label="Library"><svg class="ic"><use href="#i-lib"/></svg></button>
  <button onclick="openProv()" aria-label="Provider"><svg class="ic"><use href="#i-set"/></svg></button>
</header>
<div id="sug"></div>
<div id="prov" onclick="if(event.target===this)this.style.display='none'" style="position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:center;justify-content:center">
  <div id="provbox" style="background:var(--card);border-radius:14px;padding:14px;width:min(320px,90vw)"></div>
</div>
<div id="updbox" style="position:fixed;inset:0;background:#000b;z-index:30;display:none;align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--card);border-radius:14px;padding:20px;width:min(420px,92vw)">
    <b id="updtitle">Update available</b>
    <p id="updmsg" class="mut" style="margin:8px 0 16px;line-height:1.45"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button onclick="dismissUpdate()">Later</button>
      <a id="updlink" class="btn pri" href="#" target="_blank" rel="noopener">Download update</a>
    </div>
  </div>
</div>

<div id="listview">
  <div id="cont"></div>
  <div id="list" class="grid"></div>
</div>

<div id="libview" style="display:none">
  <div style="display:flex;align-items:center;justify-content:space-between"><h3>Library</h3><button onclick="clearLib()" style="margin:14px 12px 0">Clear all</button></div>
  <div id="libgrid" class="grid"></div>
</div>

<div id="detail">
  <div id="player">
    <button id="back" class="ov" onclick="goBack()" aria-label="Back"><svg class="ic"><use href="#i-back"/></svg></button>
    <div class="ovr">
      <button id="ccb" class="ov" onclick="toggleCC()" aria-label="Subtitles"><svg class="ic"><use href="#i-cc"/></svg></button>
      <button id="prev" class="ov" onclick="stepEp(-1)" style="display:none" aria-label="Previous"><svg class="ic"><use href="#i-prev"/></svg></button>
      <button id="next" class="ov" onclick="stepEp(1)" style="display:none" aria-label="Next">Next <svg class="ic"><use href="#i-next"/></svg></button>
      <button id="pipb" class="ov" onclick="enterPip()" style="display:none" aria-label="Pop-up player"><svg class="ic"><use href="#i-pip"/></svg></button>
      <button id="fs" class="ov" onclick="toggleFs()" aria-label="Fullscreen"><svg class="ic"><use href="#i-fs"/></svg></button>
    </div>
    <div id="spd">2× ▶▶</div>
    <button id="ratb" onclick="toggleRatioMenu(event)" aria-label="Screen ratio"><svg class="ic"><use href="#i-ratio"/></svg><span id="ratlbl">Fill</span></button>
    <div id="ratmenu">
      <button data-r="fit" onclick="setRatio('fit')">Fit <small>whole video</small></button>
      <button data-r="fill" onclick="setRatio('fill')">Fill <small>crop edges</small></button>
      <button data-r="stretch" onclick="setRatio('stretch')">Stretch <small>distort</small></button>
      <button data-r="16:9" onclick="setRatio('16:9')">16:9 <small>widescreen</small></button>
      <button data-r="4:3" onclick="setRatio('4:3')">4:3 <small>classic</small></button>
      <button data-r="21:9" onclick="setRatio('21:9')">21:9 <small>cinema</small></button>
    </div>
    <div id="ghud"><svg class="ic" id="ghudicon"><use href="#i-sun"/></svg><div id="ghudtrack"><div id="ghudfill"></div></div><b id="ghudnum">50%</b></div>
    <video id="v" controls controlslist="nofullscreen" playsinline></video>
    <div id="subs"></div>
    <div id="cc" onclick="event.stopPropagation()"></div>
    <input type="file" id="subfile" accept=".srt,.vtt,.ass,.ssa,.txt" style="display:none">
    <div id="vmsg"></div>
  </div>
  <div id="epPanel">
    <div class="phead"><select id="pSeason" onchange="panelSeason(+this.value)"></select><button onclick="history.back()" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div id="pGrid" class="egrid"></div>
  </div>
  <div class="info ha"><h2 id="dt"></h2><div id="dm" class="mut"></div></div>
  <div class="acts ha">
    <button class="pri" onclick="external()"><svg class="ic"><use href="#i-ext"/></svg> External player</button>
    <button onclick="download()"><svg class="ic"><use href="#i-dl"/></svg> Download</button>
    <button onclick="copyDownload()"><svg class="ic"><use href="#i-link"/></svg> Copy link</button>
    <button onclick="reload()"><svg class="ic"><use href="#i-re"/></svg> Retry</button>
  </div>
  <div class="info ha" style="padding-bottom:0"><select id="qsel" onchange="playIdx(+this.value,0)"></select></div>
  <div id="seasons" class="chips ha"></div>
  <div id="eps" class="chips ha" style="margin-top:6px"></div>
  <div id="dd" class="desc ha"></div>
  <h3 class="ha">For you</h3>
  <div id="more" class="grid ha"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const ic=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* MovieBox posters are multi-megabyte originals. Alibaba OSS can resize them
   on the CDN; smaller images mean much less decode work while scrolling. */
function poster(url,w=300){
  let u=String(url||'');
  if(!u)return '';
  if(/^https?:\/\/[^/]*aoneroom\.com\/image\//i.test(u)){
    if(!/[?&]x-oss-process=/i.test(u))u+=(u.includes('?')?'&':'?')+'x-oss-process=image/resize,w_'+w;
    return u;
  }
  return u.replace(/\/t\/p\/original\//i,'/t/p/w342/');
}
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let PROV=ls.get('prov','moviebox');
const api=async(p,params)=>{const r=await fetch(p+'?'+new URLSearchParams({...params,p:PROV}));if(!r.ok)throw new Error(await r.text());return r.json()};
const post=async(p,b)=>{const r=await fetch(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw new Error(await r.text());return r.json()};

let cur=null,season=0,episode=0,srcs=[],srcIdx=0,tok=0,lastItems=[],lastSave=0,homeItems=[],homeAt=0;
const V=$('#v');
const hkey=()=>PROV+':'+cur.id.value;

/* ---------- history / resume ---------- */
const hist=()=>ls.get('hist',{});
function saveProgress(force){
  if(!cur||!V.duration||isNaN(V.duration)||!V.getAttribute('src'))return;
  const now=Date.now();if(!force&&now-lastSave<4000)return;lastSave=now;
  const h=hist();
  h[hkey()]={id:cur.id.value,prov:PROV,title:cur.title,poster:cur.poster_url,type:cur.media_type,season,episode,t:V.currentTime,dur:V.duration,ts:now};
  const keys=Object.keys(h).sort((a,b)=>h[b].ts-h[a].ts).slice(0,40);
  const out={};keys.forEach(k=>out[k]=h[k]);ls.set('hist',out);
}
function renderContinue(){
  const h=Object.values(hist()).sort((a,b)=>b.ts-a.ts).slice(0,12);
  $('#cont').innerHTML=h.length?`<h3>Continue watching</h3><div class="chips" style="padding:10px">${h.map(e=>{
    const pct=e.dur?Math.min(100,e.t/e.dur*100):0;
    return `<div class="card" style="flex:none;width:110px" data-id="${esc(e.id)}" data-prov="${esc(e.prov)}" onclick="resumeItem(this)">
    <img loading="lazy" decoding="async" referrerpolicy="no-referrer" src="${esc(poster(e.poster,220))}"><div class="bar" style="width:${pct}%"></div>
    <div>${esc(e.title)}<br><small>${e.type==='series'?`S${e.season} E${e.episode}`:Math.floor(e.t/60)+' min'}</small></div></div>`}).join('')}</div>`:'';
}
function resumeItem(el){if(el.dataset.prov!==PROV){PROV=el.dataset.prov;ls.set('prov',PROV);homeItems=[];homeAt=0}openItem(el.dataset.id)}

/* ---------- lists ---------- */
function cardHtml(i){return `<div class="card" data-id="${esc(i.id.value)}" onclick="openItem(this.dataset.id)">
  <img loading="lazy" decoding="async" referrerpolicy="no-referrer" src="${esc(poster(i.poster_url,300))}" alt="">
  <div>${esc(i.title)}<br><small>${esc(i.year)} · ${i.media_type==='series'?'Series':'Movie'}</small></div></div>`}
function cards(items){lastItems=items;$('#list').innerHTML=items.map(cardHtml).join('')}
let curView='home',panelOpen=false;
function show(v){
  curView=v;
  $('#listview').style.display=v==='home'?'block':'none';
  $('#libview').style.display=v==='lib'?'block':'none';
  $('#detail').style.display=v==='detail'?'block':'none';
  $('#hd').style.display=v==='detail'?'none':'flex';
  $('#sug').style.display='none';
  $('#bHome').classList.toggle('on',v==='home');$('#bLib').classList.toggle('on',v==='lib');
}
function nav(v){
  if(curView===v)history.replaceState({v},'');else history.pushState({v},'');
  show(v);
}
function leaveDetail(){
  $('#cc').style.display='none';endFast();saveProgress(true);tok++;V.pause();V.removeAttribute('src');V.load();
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  closePanelUI();
}
history.replaceState({v:'home'},'');
window.addEventListener('popstate',e=>{
  if(panelOpen){closePanelUI();return}
  const v=(e.state&&e.state.v)||'home';
  if(curView==='detail')leaveDetail();

let gest=null;
V.addEventListener('pointerdown',e=>{
  if(e.button!==undefined&&e.button!==0)return;
  const r=V.getBoundingClientRect();
  if(e.clientY>r.bottom-64)return;   // keep the native control bar usable
  gest={id:e.pointerId,x:e.clientX,y:e.clientY,mode:null,side:e.clientX<r.left+r.width/2?'bright':'vol',t:Date.now()};
  gest.start=gest.side==='bright'?brightness:volume;
  try{V.setPointerCapture(e.pointerId)}catch(_){}
  if(!V.paused){
    clearTimeout(lpT);
    lpT=setTimeout(()=>{
      if(!gest||gest.mode)return;
      fast=true;
      const f=Math.min(16,userRate*2);
      V.playbackRate=f;
      $('#spd').textContent=(+f.toFixed(2))+'× ▶▶';$('#spd').style.display='block';
    },450);
  }
});
V.addEventListener('pointermove',e=>{
  if(!gest||e.pointerId!==gest.id)return;
  const dx=e.clientX-gest.x,dy=e.clientY-gest.y;
  if(!gest.mode){
    if(Math.abs(dx)<12&&Math.abs(dy)<12)return;
    clearTimeout(lpT);
    if(Math.abs(dx)>=Math.abs(dy)){gest.mode='x';return}   // horizontal: let native seek win
    gest.mode='y';
    if(fast)endFast();
  }
  if(gest.mode==='y'){
    if(e.cancelable)e.preventDefault();
    const h=V.getBoundingClientRect().height||1;
    const v=gest.start+(gest.y-e.clientY)/(h*0.6);
    if(gest.side==='bright')applyBrightness(v);else applyVolume(v);

function parseTime(h,m,sec,ms){return (+h||0)*3600+(+m)*60+(+sec)+(+((ms+'000').slice(0,3)))/1000}
function parseSubs(text){
  text=text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
  const clean=t=>t.replace(/\{[^}]*\}/g,'').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').trim();
  const out=[];
  if(/\[Events\]/i.test(text)){                       // ASS / SSA
    text.split('\n').forEach(l=>{
      const m=l.match(/^Dialogue:\s*[^,]*,(\d+):(\d+):(\d+)[.](\d+),(\d+):(\d+):(\d+)[.](\d+),(?:[^,]*,){6}(.*)$/);
      if(m)out.push({s:parseTime(m[1],m[2],m[3],m[4]),e:parseTime(m[5],m[6],m[7],m[8]),t:clean(m[9].replace(/\\N/gi,'\n'))});
    });
  }else{
    text.split(/\n{2,}/).forEach(b=>{
      const L=b.split('\n');const i=L.findIndex(x=>x.includes('-->'));if(i<0)return;
      const m=L[i].match(/(?:(\d+):)?(\d+):(\d+)[.,](\d+)\s*-->\s*(?:(\d+):)?(\d+):(\d+)[.,](\d+)/);if(!m)return;
      const t=clean(L.slice(i+1).join('\n'));if(t)out.push({s:parseTime(m[1],m[2],m[3],m[4]),e:parseTime(m[5],m[6],m[7],m[8]),t});
    });
  }
  return out.filter(c=>c.t).sort((a,b)=>a.s-b.s);
}
async function decodeBuf(buf){
  const u=new Uint8Array(buf);
  if(u[0]===0xFF&&u[1]===0xFE)return new TextDecoder('utf-16le').decode(buf);
  if(u[0]===0xFE&&u[1]===0xFF)return new TextDecoder('utf-16be').decode(buf);
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('windows-1252').decode(buf)}
}

  const el=$('#subs');
  if(!cues.length){if(subCur!==-1){el.innerHTML='';subCur=-1}return}
  const t=V.currentTime-subDelay;
  let lo=0,hi=cues.length-1,idx=-1;
  while(lo<=hi){const mid=(lo+hi)>>1;if(cues[mid].s<=t){idx=mid;lo=mid+1}else hi=mid-1}
  let hit=-1;
  for(let k=idx;k>=0&&k>idx-4;k--){if(cues[k].e>=t){hit=k;break}}
  if(hit===subCur)return;
  subCur=hit;
  if(hit<0){el.innerHTML='';return}
  const sp=document.createElement('span');sp.textContent=cues[hit].t;
  el.innerHTML='';el.appendChild(sp);applySubStyle();
}
let subRaf=0;
function subLoop(){tickSubs();subRaf=(!V.paused&&cues.length)?requestAnimationFrame(subLoop):0}
V.addEventListener('playing',()=>{if(!subRaf)subRaf=requestAnimationFrame(subLoop)});
V.addEventListener('seeked',tickSubs);V.addEventListener('timeupdate',tickSubs);
function resetSubs(){cues=[];subList=[];subSel=-2;subDelay=0;subCur=-1;$('#subs').innerHTML='';$('#ccb').style.opacity=.7;renderCC()}
async function loadSubList(){
  const s=srcs.find(x=>x.rid);if(!s&&PROV!=='moviebox')return;
  try{
    const l=await api('/api/subs',{id:cur.id.value,rid:(s&&s.rid)||'',sib:(cur.dubs||[]).map(d=>d.subject_id).join(','),season,episode});
    subList=l;
    const want=(ls.get('sublang','')||'').toLowerCase();
    if(want&&want!=='off'){const i=l.findIndex(x=>x.name.toLowerCase()===want);if(i>=0)pickSub(i);else renderCC()}
    else renderCC();
  }catch(e){}
}
async function pickSub(i){
  if(i===-1){cues=[];subSel=-1;subCur=-1;$('#subs').innerHTML='';ls.set('sublang','off');$('#ccb').style.opacity=.7;renderCC();return}
  const sub=subList[i];if(!sub)return;
  subSel=i;renderCC();
  try{
    const r=await fetch('/proxy?'+new URLSearchParams({url:sub.url}));
    if(!r.ok)throw new Error('HTTP '+r.status);
    cues=parseSubs(await decodeBuf(await r.arrayBuffer()));subCur=-1;
    if(!cues.length)throw new Error('empty');
    ls.set('sublang',sub.name);$('#ccb').style.opacity=1;tickSubs();
  }catch(e){cues=[];subSel=-1;msg("Couldn't load that subtitle");setTimeout(()=>msg(''),2000)}
  renderCC();
}
$('#subfile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{cues=parseSubs(await decodeBuf(await f.arrayBuffer()));subSel='f';subCur=-1;$('#ccb').style.opacity=1;tickSubs();if(!cues.length)msg('No subtitles found in file')}catch(err){msg('Bad subtitle file')}
  e.target.value='';renderCC();
});
function toggleCC(){const m=$('#cc');m.style.display=m.style.display==='block'?'none':'block';renderCC();hideRatioMenu();wake()}
V.addEventListener('click',()=>{$('#cc').style.display='none'});
/* fade the menu while dragging a slider so the live subtitle is visible */
$('#cc').addEventListener('pointerdown',e=>{if(e.target.type==='range')$('#cc').classList.add('peek')});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>$('#cc').classList.remove('peek')));
function renderCC(){
  const chip=(label,on,fn)=>`<button class="${on?'on':''}" onclick="${fn}">${esc(label)}</button>`;
  const rowSub=chip('Off',subSel===-1||subSel===-2,'pickSub(-1)')+subList.map((x,i)=>chip(x.name,subSel===i,`pickSub(${i})`)).join('')+chip(subSel==='f'?'File ✓':'+ File',subSel==='f',"$('#subfile').click()");
  $('#cc').innerHTML=`<h4>Subtitles</h4><div class="row2">${rowSub}</div>
  <h4>Size · ${SS.size}%</h4><input type="range" min="50" max="300" step="10" value="${SS.size}" oninput="SS.size=+this.value;applySubStyle();this.previousElementSibling.textContent='Size · '+this.value+'%'">
  <h4>Color</h4><div class="row2">${COLORS.map(c=>`<button class="sw ${SS.color===c?'on':''}" style="background:${c}" onclick="SS.color='${c}';applySubStyle();renderCC()" aria-label="${c}"></button>`).join('')}</div>
  <h4>Background</h4><div class="row2">${['none','soft','solid'].map(b=>chip(b[0].toUpperCase()+b.slice(1),SS.bg===b,`SS.bg='${b}';applySubStyle();renderCC()`)).join('')}</div>
  <h4>Position · ${SS.pos}%</h4><input type="range" min="3" max="45" step="1" value="${SS.pos}" oninput="SS.pos=+this.value;applySubStyle();this.previousElementSibling.textContent='Position · '+this.value+'%'">
  <h4>Sync · ${subDelay>0?'+':''}${subDelay.toFixed(1)}s</h4><div class="row2"><button onclick="subDelay-=0.5;tickSubs();subCur=-1;tickSubs();renderCC()">−0.5s</button><button onclick="subDelay=0;subCur=-1;tickSubs();renderCC()">0</button><button onclick="subDelay+=0.5;subCur=-1;tickSubs();renderCC()">+0.5s</button></div>
  <div class="row2" style="margin-top:10px"><button onclick="Object.assign(SS,{size:100,color:'#ffffff',bg:'soft',pos:14});applySubStyle();renderCC()">Reset style</button><button onclick="$('#cc').style.display='none'">Close</button></div>`;
}
applySubStyle();

/* ---------- external player / download ---------- */
async function current(){
  const s=srcs[srcIdx];if(!s){msg('No source yet');return null}
  try{if(s.rel)msg('Resolving mirror…');const r=await srcFor(s);msg('');return r}catch(e){msg(e.message);return null}
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){}
  try{
    const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';
    document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok;
  }catch(e){return false}
}
async function external(){
  const r=await current();if(!r)return;
  const path='/proxy?'+pq(r);
  if(!/Android/i.test(navigator.userAgent)){      // desktop: copy the link for VLC / mpv
    if(await copyText(location.origin+path))msg('Link copied. Paste it in VLC: Media > Open Network Stream');
    else prompt('Copy this link into VLC (Open Network Stream):',location.origin+path);
    setTimeout(()=>msg(''),4000);return;
  }
  V.pause();
  location.href='intent://'+location.host+path+'#Intent;scheme=http;type=video/*;end';
}
function dlName(r){
  const m=(r.url.split('?')[0].match(/\.(mp4|mkv|webm|m4v|ts)$/i)||[])[1]||'mp4';
  const q=(srcs[srcIdx]||{}).quality||'';
  return cur.title+(cur._ss?` S${String(season).padStart(2,'0')}E${String(episode).padStart(2,'0')}`:'')+' '+q+'.'+m;
}
function dlUrl(r){
  return location.origin+'/proxy?'+pq(r)+'&dl=1&name='+encodeURIComponent(dlName(r));
}
async function download(){
  const r=await current();if(!r)return;
  const nm=dlName(r);
  const a=document.createElement('a');
  a.href=dlUrl(r);a.download=nm;
  document.body.appendChild(a);a.click();a.remove();
  msg('Download started');setTimeout(()=>msg(''),2500);
}
async function copyDownload(){
  const r=await current();if(!r)return;
  if(await copyText(dlUrl(r)))msg('Download link copied');
  else prompt('Copy this download link:',dlUrl(r));
  setTimeout(()=>msg(''),2500);
}

/* ---------- suggestions / provider ---------- */
let sugT;
$('#q').addEventListener('input',()=>{
  clearTimeout(sugT);const q=$('#q').value.trim();
  if(q.length<2){$('#sug').style.display='none';return}
  sugT=setTimeout(async()=>{
    try{
      const l=await api('/api/suggest',{q});const b=$('#sug');
      if($('#q').value.trim()!==q)return;
      if(!l.length){b.style.display='none';return}
      b.innerHTML=l.map((x,i)=>`<div class="row" data-i="${i}"><img loading="lazy" decoding="async" referrerpolicy="no-referrer" src="${esc(poster(x.poster,120))}"><div><b>${esc(x.title)}</b><br><small class="mut">${esc(x.year)} · ${x.type==='series'?'Series':'Movie'}</small></div></div>`).join('');
      b.style.display='block';
      [...b.children].forEach((el,i)=>el.onclick=()=>{b.style.display='none';openItem(l[i].id)});
    }catch(e){}
  },250);
});
document.addEventListener('click',e=>{if(!e.target.closest('#sug')&&e.target.id!=='q')$('#sug').style.display='none'});
async function openProv(){
  const [l,cfg]=await Promise.all([
    fetch('/api/providers').then(r=>r.json()),
    fetch('/api/config').then(r=>r.json()).catch(()=>null)
  ]);
  const rules=cfg?`<div class="mut" style="font-size:11px;margin-top:10px">Playback rules v${esc(cfg.version)} · ${esc(cfg.source)}</div>`:'';
  const debug=(cur&&PROV==='moviebox')?'<button style="display:block;width:100%;margin:6px 0;text-align:left;border-radius:10px" onclick="openDebug()">Inspect MovieBox response</button>':'';
  $('#provbox').innerHTML='<b>Provider</b>'+l.map(x=>`<button style="display:block;width:100%;margin:6px 0;text-align:left;border-radius:10px" class="${x.id===PROV?'on':''}" onclick="setProv('${x.id}')">${esc(x.label)}</button>`).join('')+debug+rules;
  $('#prov').style.display='flex';
}
function openDebug(){
  if(!cur)return;
  let u='/api/debug/moviebox?id='+encodeURIComponent(cur.id.value);
  if(season)u+='&season='+season+'&episode='+episode;
  $('#prov').style.display='none';
  window.open(u,'_blank');
}
function setProv(id){PROV=id;ls.set('prov',id);homeItems=[];homeAt=0;$('#prov').style.display='none';$('#q').value?doSearch():loadHome()}

let updLatest='';
async function checkUpdate(){
  try{
    const u=await fetch('/api/version').then(r=>r.json());
    if(!u||!u.update_available||!u.latest_url)return;
    updLatest=u.latest_version||'';
    $('#updtitle').textContent='Update available · v'+updLatest;
    $('#updmsg').textContent=(u.message||'A newer version is available.')+' You are on v'+u.version+'.';
    const a=$('#updlink');a.href=u.latest_url;
    a.onclick=e=>{if(hasBridge()){e.preventDefault();native('openUrl',u.latest_url)}};
    $('#updbox').style.display='flex';
  }catch(e){}
}
function dismissUpdate(){
  $('#updbox').style.display='none';
}

loadHome();
checkUpdate();
</script></body></html>
